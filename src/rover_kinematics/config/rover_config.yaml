use_sim_time: false           

# Update (based on real)
wheels_distance_length: 0.900
wheels_distance_width:  0.654
wheel_diameter: 0.25

poles_pair_number: 7         
motor_gear_ratio: 25.0        

min_erpm: 450.0
max_erpm: 100000.0        

initialization_timeout_sec: 5.0
stop_timeout_sec: 5.0

feedback_timeout_sec: 0.5

publish_rate: 20.0       

# Steer angle max limit - per wheel [fl=front-left, fr=front-right, rl=rear-left, rr=rear-right]
max_mechanical_angle_fl:  1.57   # [rad]
max_mechanical_angle_fr:  1.57   # [rad]
max_mechanical_angle_rl:  1.57   # [rad]
max_mechanical_angle_rr:  1.57   # [rad]

# Steer angle min limit - per wheel [fl=front-left, fr=front-right, rl=rear-left, rr=rear-right]
min_mechanical_angle_fl: -1.57   # [rad]
min_mechanical_angle_fr: -1.57   # [rad]
min_mechanical_angle_rl: -1.57   # [rad]
min_mechanical_angle_rr: -1.57   # [rad]

# Motor polarity — per wheel [fl=front-left, fr=front-right, rl=rear-left, rr=rear-right]
invert_drive_fl: false
invert_drive_fr: false
invert_drive_rl: false
invert_drive_rr: false

# Steer polarity — per wheel [fl=front-left, fr=front-right, rl=rear-left, rr=rear-right]
invert_steering_fl: true
invert_steering_fr: true
invert_steering_rl: true
invert_steering_rr: true

max_steering_radius: 5.0    
min_steering_radius: 1.0     

pose_covariance_diagonal:  [0.001, 0.001, 0.001, 0.001, 0.001, 0.03]  
twist_covariance_diagonal: [0.001, 0.001, 0.001, 0.001, 0.001, 0.03]

base_frame_id: '/base_link'
odom_frame_id: '/odom' 
publish_tf: false

cmd_vel_timeout_sec: 0.5

cmd_vel_autonomy_topic: '/navigation/cmd_vel'
# cmd_vel_autonomy_topic: '/cmd_vel_smoothed'

# ── Steering coherence safety ──────────────────────────────────────────────────
# Fits a rigid-body twist to the four steering feedback angles each cycle.
# If the mean normalised residual exceeds the threshold, drive is suppressed
# until the wheels realign (e.g. when exiting spin mode).
# Range: (0.0, 1.0].  Lower = stricter.  0.15 blocks drive when wheels are
# more than ~22° incoherent on average.
enable_coherence_safety: true
steering_coherence_threshold: 0.15

# # # # Update (base on real)
huber_loss_threshold: 0.5
twist_ema_alpha: 0.8
se2_integration_omega_threshold: 1.0e-4

solver_max_num_iterations: 200
solver_function_tolerance: 1.0e-8
solver_gradient_tolerance: 1.0e-10
solver_parameter_tolerance: 1.0e-9
solver_minimizer_progress_to_stdout: false
solver_linear_solver_type: 'DENSE_QR'
solver_trust_region_strategy_type: 'DOGLEG'
# # # #

# # # # Unfinished
use_measurement_timestamp: false
# # # #

# # # # Unfinished
enable_dynamic_wheel_weighting: false
wheel_quality_low_erpm_threshold: 500.0
wheel_quality_high_current_threshold: 20.0
wheel_quality_high_duty_threshold: 0.85
wheel_quality_min_weight: 0.0
# # # #