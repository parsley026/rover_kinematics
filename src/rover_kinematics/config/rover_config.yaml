# ---
# wheels_distance_length: 0.99  # [m]
# wheels_distance_width: 0.74 # [m] 
# wheel_diameter: 0.24         # [m]
# poles_pair_number: 15        # Number of poles in the motor
# velocity_limit: 1.0          # [m/s]
# publish_rate: 20.0           # [Hz] (Recommended: 20.0, Maximum: 50.0)
# use_sim_time: true          # Use simulation time


# max_steering_radius: 5.0     # [m] Maximum steering radius of the robot
# min_steering_radius: 1.0     # [m] Minimum steering radius of the robot

# # Odometry covariances for the encoder output of the robot. These values should
# # be tuned to your robot's sample odometry data, but these values are a good place
# # to start
# #                          [x,     y,     z,     roll,  pitch, yaw]
# pose_covariance_diagonal:  [0.001, 0.001, 0.001, 0.001, 0.001, 0.03]  
# twist_covariance_diagonal: [0.001, 0.001, 0.001, 0.001, 0.001, 0.03]

# # Top level frame (link) of the robot description
# base_frame_id: '/base_link'  # Base frame id

# # Transform from odom -> base_link: Enable if NOT:
# # using ekf_localization or simulation source
# odom_frame_id: '/odom'      # Odom frame id
# enable_odom_tf: false       # Enable odom -> base_link transform (true - real robot, false - simulation)

---

wheels_distance_length: 0.900
wheels_distance_width:  0.654
wheel_diameter: 0.25

poles_pair_number: 15         
motor_gear_ratio: 1.0        
min_erpm: 0.0
max_erpm: 100000.0             
velocity_limit: 1.0          
publish_rate: 20.0           
use_sim_time: true           
feedback_timeout_sec: 0.5    

max_mechanical_angle: 1.57

max_steering_radius: 5.0    
min_steering_radius: 1.0     

pose_covariance_diagonal:  [0.001, 0.001, 0.001, 0.001, 0.001, 0.03]  
twist_covariance_diagonal: [0.001, 0.001, 0.001, 0.001, 0.001, 0.03]

base_frame_id: '/base_link'

odom_frame_id: '/odom'      
enable_odom_tf: false

use_measurement_timestamp: false

huber_loss_threshold: 0.5
twist_ema_alpha: 0.8
se2_integration_omega_threshold: 1.0e-4

solver_max_num_iterations: 200
solver_function_tolerance: 1.0e-8
solver_gradient_tolerance: 1.0e-10
solver_parameter_tolerance: 1.0e-9
solver_minimizer_progress_to_stdout: false
solver_linear_solver_type: 'DENSE_QR'
solver_trust_region_strategy_type: 'DOGLEG'

enable_dynamic_wheel_weighting: false
wheel_quality_low_erpm_threshold: 500.0
wheel_quality_high_current_threshold: 20.0
wheel_quality_high_duty_threshold: 0.85
wheel_quality_min_weight: 0.0

cmd_vel_autonomy_topic: '/cmd_vel'
# cmd_vel_autonomy_topic: '/cmd_vel_smoothed'

---

