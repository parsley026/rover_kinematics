services:
  rover-kinematics:
    build:
      context: .
      dockerfile: ./.devcontainer/Dockerfile
      args:
        SSH_PORT: 2123
    image: rover-kinematics
    container_name: rover-kinematics
    hostname: rover-kinematics
    stdin_open: true
    tty: true
    pid: "host"
    ipc: "host"
    init: true
    network_mode: "host"
    privileged: true
    environment:
      - TZ=Europe/Warsaw
      - ROS_ENABLE_AUTOSTART=1
      - ROS_BUILD_ON_STARTUP=on-failure
    volumes:
      - type: bind
        source: ./
        target: /mnt/local
        bind:
          create_host_path: true
      - type: bind
        source: ./.devcontainer/rex
        target: /etc/init.d/rex
        bind:
          create_host_path: true
      - type: bind
        source: /dev/shm
        target: /dev/shm
    restart: unless-stopped
